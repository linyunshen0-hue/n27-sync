name: supabase-keepalive

# 免费版项目 7 天没有任何 API 请求会被暂停；这里每 2 天打一次 health() RPC。
# anon key 是公开的（前端页面里就有），所以直接写在这里，不占 secret。
# 注意：GitHub 会在仓库 60 天无提交时停用 schedule —— 所以本机还有一条计划任务
#       双保险（评论服务/supabase/keepalive.bat）。

on:
  schedule:
    - cron: '17 3 */2 * *'      # UTC 03:17 = 北京时间 11:17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: health()
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST             'https://aqskipwcuevcptmeqnlq.supabase.co/rest/v1/rpc/health'             -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxc2tpcHdjdWV2Y3B0bWVxbmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NzQzMTksImV4cCI6MjExMDI1MDMxOX0._IgLOcHjMNALZ1qKIkZ8RHsxaKzEjPn2d7t1qAz_WAQ'             -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxc2tpcHdjdWV2Y3B0bWVxbmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NzQzMTksImV4cCI6MjExMDI1MDMxOX0._IgLOcHjMNALZ1qKIkZ8RHsxaKzEjPn2d7t1qAz_WAQ'             -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
