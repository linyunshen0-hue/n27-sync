<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冲刺模考 · 工作台</title>
<style>
html,body{max-width:100%;overflow-x:hidden}
:root{
  --bg:#f2f4f7; --card:#fff; --line:#e6e9ee; --text:#1b1f26; --muted:#8b93a1;
  --pri:#0866ff; --pri-soft:#eaf1ff; --ok:#0fa968; --ok-soft:#e9f9f1;
  --no:#e5484d; --no-soft:#fdecec; --warn:#e08a00; --warn-soft:#fff6e6;
  --note:#8b5cf6; --note-soft:#f3eeff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d3d8e0;border-radius:4px}

/* 顶栏 */
.topbar{flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:30}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;white-space:nowrap}
.logo i{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,#0866ff,#4d9bff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-style:normal;font-weight:800}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
.search:focus-within{border-color:var(--pri);background:#fff}
.search input{flex:1;border:none;outline:none;background:none;font-size:13.5px}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--pri);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.spacer{flex:1}
.hstat{display:flex;gap:14px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.hstat b{color:var(--text);font-size:13.5px}

/* 布局 */
.layout{flex:1;display:flex;min-height:0}
.side{flex:0 0 290px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-nav{display:flex;gap:1px;padding:8px 8px 5px;border-bottom:1px solid var(--line)}
.side-nav button{flex:1;padding:6px 2px;border-radius:7px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.side-nav button:hover{background:var(--bg)}
.side-nav button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.side-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.side-body{flex:1;overflow-y:auto;padding:6px 8px 24px}
.side-title{font-size:11px;font-weight:700;color:#a3aab6;letter-spacing:.5px;padding:9px 6px 5px;text-transform:uppercase}
.li{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;transition:.1s}
.li:hover{background:var(--bg)}
.li.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .c{font-size:11px;color:var(--muted);flex:0 0 auto}
.li.lv1{font-weight:700;font-size:13.5px}
.li.lv2{font-weight:600;padding-left:16px}
.li.lv3{padding-left:28px;color:#4a5160}
.li.lv4{padding-left:40px;font-size:12.5px;color:#5b6270}
.li .tw{flex:0 0 12px;color:#b8bfca;font-size:10px;transition:transform .15s}
.li .tw.open{transform:rotate(90deg)}
.li .bar{width:30px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:0 0 auto}
.li .bar i{display:block;height:100%;background:var(--pri)}
.back-link{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:6px 6px 3px;cursor:pointer}
.back-link:hover{color:var(--pri)}

/* 中栏 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.main-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.main-head .where{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main-head .where b{color:var(--text);font-weight:600}
.pbar{flex:0 0 110px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri);transition:width .2s}
.qwrap{flex:1;overflow-y:auto;padding:18px 20px 26px}
.qcard{max-width:840px;margin:0 auto}
.q-meta{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--pri-soft);color:var(--pri)}
.tag.gray{background:#f0f2f5;color:#6b7280}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.tag.r{background:var(--no-soft);color:var(--no)}
.tag.o{background:var(--warn-soft);color:var(--warn)}
.tag.n{background:var(--note-soft);color:var(--note)}
.kdlink{font-size:12px;color:var(--muted);cursor:pointer;border-bottom:1px dashed #ccd3de}
.kdlink:hover{color:var(--pri);border-color:var(--pri)}
.q-title{font-size:17px;line-height:1.7;font-weight:500;margin-bottom:16px;letter-spacing:.2px;position:relative;padding-right:34px}
.nbtn{position:absolute;right:0;top:0;width:28px;height:28px;border-radius:8px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.5;transition:.13s;border:1px solid transparent;cursor:pointer}
.nbtn:hover{opacity:1;background:var(--note-soft);border-color:#ddd0ff}
.nbtn.has{opacity:1;background:var(--note-soft);color:var(--note);border-color:#ddd0ff}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 12px 11px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:9px;transition:.13s;text-align:left;width:100%;position:relative;cursor:pointer}
.opt:hover{border-color:#b9c6e4;background:#fbfcff}
.opt .k{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid #ccd3de;color:#98a0ad;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .v{flex:1;font-size:14.8px;line-height:1.55;color:#2a2f38}
.opt .o-nbtn{flex:0 0 26px;height:26px;border-radius:7px;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:.42;transition:.13s;border:1px solid transparent;cursor:pointer}
.opt .o-nbtn:hover{opacity:1;background:var(--note-soft);border-color:#ddd0ff}
.opt .o-nbtn.has{opacity:1;background:var(--note-soft);color:var(--note);border-color:#ddd0ff}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.multi-tip{font-size:11.5px;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:5px;display:inline-block;margin-bottom:9px}
.q-act{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);flex-wrap:wrap}
.q-act .q-sub{height:44px;padding:0 28px;font-size:15px;border-radius:10px;flex:0 0 auto;font-weight:600}
.q-act .q-sub[disabled]{opacity:.55}
.q-act .kbd-hint{margin-left:10px;font-size:11px;opacity:.8;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:1px 5px;font-weight:400}
.q-act-tip{font-size:11.8px;color:var(--muted)}
.q-act-ok{font-size:13.5px;font-weight:600;color:var(--ok)}
.q-act-ok.no{color:var(--no)}

/* 工具条 */
.tools{flex:0 0 auto;display:flex;justify-content:center;padding:9px 20px;background:var(--card);border-top:1px solid var(--line)}
.tools-inner{width:100%;max-width:840px;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow-x:auto}
.btn{height:36px;padding:0 14px;border-radius:8px;background:var(--bg);font-size:13.5px;display:inline-flex;align-items:center;gap:5px;transition:.12s;border:1px solid transparent;white-space:nowrap;flex-shrink:0}
.btn:hover{background:#e9ecf1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:#0057dd}
.btn.line{border-color:var(--line);background:var(--card)}.btn.line:hover{background:var(--bg)}
.btn.danger{background:var(--no-soft);color:var(--no)}
.btn.danger:hover{background:#fbdcdc}
.btn.ok{background:var(--ok);color:#fff}
.tools .grow{flex:1}
.tools .pos{font-size:12.5px;color:var(--muted);min-width:60px}
.tools .pos b{color:var(--text);font-size:14px}
.swipetip{font-size:10px;color:#a3aab6;border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-left:2px;font-weight:400}
@media (hover:hover){.swipetip{display:none}}
kbd{font-family:inherit;font-size:10.5px;background:#f0f2f5;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:#8b93a1}

/* 右栏 */
.detail{flex:0 0 380px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.detail-head{flex:0 0 auto;padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}
.detail-body{flex:1;overflow-y:auto;padding:14px 16px 40px}
.d-sec{margin-bottom:16px}
.d-sec h4{font-size:11px;font-weight:700;color:#a3aab6;letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ans-row{display:flex;gap:8px}
.ans-box{flex:1;background:var(--bg);border-radius:8px;padding:9px 11px}
.ans-box .lbl{font-size:10.5px;color:var(--muted);margin-bottom:1px}
.ans-box .val{font-size:18px;font-weight:800;letter-spacing:1px}
.ans-box.ok .val{color:var(--ok)}.ans-box.no .val{color:var(--no)}
.ex-text{font-size:13.5px;line-height:1.78;color:#3a404b;white-space:pre-wrap;word-break:break-word}
.mantra{background:linear-gradient(135deg,#f6f3ff,#edf3ff);border:1px solid #e0e6ff;border-radius:9px;padding:10px 12px;margin-bottom:8px}
.mantra .mh{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#6248d6;margin-bottom:5px}
.mantra .mt{font-size:13.2px;line-height:1.72;color:#2b2f3a;white-space:pre-wrap}
.mantra.disc{background:linear-gradient(135deg,#fff9f2,#fff3e8);border-color:#ffe2c4}
.mantra.disc .mh{color:#c97a00}
.rel-list .li{font-size:12.5px;padding:5px 7px;align-items:flex-start}
.rel-list .li .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}
.empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#c2c8d2;font-size:12.5px;gap:8px;text-align:center;padding:24px}
/* 窄屏（≤1040）解析卡片：紧跟在题目下面 */
.mob-detail{margin:14px auto 4px;max-width:840px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px 13px}
.mob-detail-h{font-size:10.5px;font-weight:700;color:#a3aab6;letter-spacing:.5px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mob-detail .d-sec:last-child{margin-bottom:0}
.mob-detail .empty-detail{height:auto;padding:0;color:#b3bac5}
/* 抽屉标题条（仅手机显示） */
.drawer-hd{display:none;align-items:center;gap:8px;padding:9px 10px 2px;font-size:13px;font-weight:700}
.drawer-hd .b{margin-left:auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);background:var(--bg);line-height:1}
/* ===== 评论区 ===== */
.cmtlink{font-size:12px;cursor:pointer;color:var(--pri);white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.cmtlink:hover{text-decoration:underline}
.cmtlink.zero{color:var(--muted)}
.cs-mask{position:fixed;inset:0;background:rgba(10,15,25,.42);z-index:10000;opacity:0;pointer-events:none;transition:.18s}
.cs-mask.on{opacity:1;pointer-events:auto}
.cs{position:fixed;right:0;top:0;bottom:0;width:430px;max-width:100vw;background:var(--card);z-index:10001;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-6px 0 40px rgba(0,0,0,.18)}
.cs.on{transform:none}
.cs-hd{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.cs-hd .who{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--muted)}
.cs-hd .x{font-size:19px;color:var(--muted);cursor:pointer;line-height:1;margin-left:4px}
.cs-bd{flex:1;overflow-y:auto;padding:10px 12px 14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cs-sec{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:#a3aab6;text-transform:uppercase;margin:10px 2px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cs-sec b{color:var(--pri);font-weight:700}
.citem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.citem.mine{background:#fbfcff;border-color:#dbe6ff}
.citem .cmeta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.citem .cnick{font-weight:700;color:#3a404b;font-size:12.3px}
.citem .cbadge{background:var(--pri-soft);color:var(--pri);border-radius:5px;padding:0 5px;font-size:10.5px}
.citem .ctext{font-size:13.3px;line-height:1.72;color:#2b2f3a;white-space:pre-wrap;word-break:break-word}
.citem .creply{margin-top:5px;padding:5px 8px;background:var(--bg);border-radius:6px;font-size:12px;color:#6b7280;white-space:pre-wrap;word-break:break-word}
.citem .cact{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cbtn{border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12px;background:var(--card);color:#5b6270;display:inline-flex;align-items:center;gap:4px}
.cbtn.on{background:var(--pri-soft);border-color:#b9c6e4;color:var(--pri);font-weight:700}
.cbtn.del{color:var(--no)}
.cbtn.up{padding:1px 6px}
.cbtn:disabled{opacity:.35}
.cs-ft{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:flex-end}
.cs-ft textarea{flex:1;height:56px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;line-height:1.5;resize:none;outline:none}
.cs-ft textarea:focus{border-color:var(--pri)}
.cs-login{background:var(--bg);border-radius:10px;padding:12px;font-size:12.5px;color:#5b6270;margin-bottom:10px;width:100%}
.cs-login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;outline:none;margin-bottom:6px;background:#fff}
.cs-login input:focus{border-color:var(--pri)}
.cs-login .row{display:flex;gap:7px}
.cs-login .row .btn{flex:1;justify-content:center;height:34px;font-size:13px}
.cs-empty{text-align:center;color:#b3bac5;font-size:12.5px;padding:28px 10px;line-height:1.8}
/* 评论区（嵌在题目下方） */
.cmt-box{margin:16px auto 10px;max-width:840px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px 14px}
.cmt-hd{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cmt-hd .n{font-weight:400;color:var(--muted);font-size:11.5px}
.cmt-reload{margin-left:auto;font-size:11.5px;color:var(--pri);cursor:pointer}
.cmt-state{color:#b3bac5;font-size:11px}
.cmt-list{display:flex;flex-direction:column;gap:8px}
.cmt-list .citem{margin-bottom:0}
.cmt-ft{display:flex;gap:7px;align-items:flex-end;margin-top:10px}
.cmt-ft textarea{flex:1;height:52px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;line-height:1.5;resize:none;outline:none}
.cmt-ft textarea:focus{border-color:var(--pri)}
/* 收藏按钮放大 */
.favbtn{font-size:19px;line-height:1;width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#ccd3de;border:1px solid transparent;transition:.13s}
.favbtn:hover{background:var(--warn-soft);border-color:#ffe2c4}
.favbtn.on{color:#e08a00}
/* 用户中心 */
.uc-card{background:var(--bg);border-radius:10px;padding:11px;margin-bottom:10px;font-size:12.5px;color:#5b6270}
.uc-card input,.uc-card textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;line-height:1.5;outline:none;background:#fff;margin-bottom:6px;resize:vertical}
.uc-card input:focus,.uc-card textarea:focus{border-color:var(--pri)}
.uc-card textarea{height:70px}
.uc-line{line-height:1.9}
.uc-row{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.uc-row input{flex:1;min-width:110px;margin-bottom:0}
.uc-row .btn{flex:0 0 auto;height:34px;font-size:12.5px;padding:0 10px;white-space:nowrap}
.uc-hd{font-size:11px;font-weight:700;letter-spacing:.5px;color:#a3aab6;text-transform:uppercase;margin:12px 2px 6px;display:flex;gap:6px;align-items:center}
.uc-hd span{font-weight:400;color:#b3bac5;text-transform:none;font-size:11px}
.sug{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px}
.sug .sm{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center;margin-bottom:3px}
.sug .sn{font-weight:700;color:#3a404b;font-size:12px}
.sug .st{font-size:13px;line-height:1.7;color:#2b2f3a;white-space:pre-wrap;word-break:break-word}
.sug .sa{display:flex;gap:6px;margin-top:6px}

/* 笔记弹层 */
.npop{position:absolute;z-index:80;width:340px;background:var(--card);border:1px solid #ddd0ff;border-radius:12px;box-shadow:0 16px 40px rgba(30,20,60,.18);padding:12px;display:none}
.npop.on{display:block}
.npop .nh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--note);margin-bottom:7px}
.npop .nh span{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;cursor:pointer}
.npop textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;line-height:1.65;resize:vertical;outline:none}
.npop textarea:focus{border-color:var(--note);box-shadow:0 0 0 3px rgba(139,92,246,.1)}
.npop .nf{display:flex;gap:7px;margin-top:8px}
.npop .nf .btn{height:31px;font-size:12.5px;padding:0 12px}
.npop .nf .del{color:var(--no);margin-left:auto}

/* 答题卡 */
.sheet-mask{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:50;opacity:0;pointer-events:none;transition:.16s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:92vw;background:var(--card);z-index:51;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-hd{flex:0 0 auto;padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.sheet-hd h3{font-size:15px;font-weight:700}
.sheet-hd .x{margin-left:auto;font-size:19px;color:var(--muted);cursor:pointer;line-height:1}
.sheet-bd{flex:1;overflow-y:auto;padding:14px 18px 28px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}
.grid b{height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;background:var(--bg);color:#6b7280;cursor:pointer;border:1.5px solid transparent;position:relative}
.grid b:hover{border-color:#c9d3e6}
.grid b.done{background:var(--pri-soft);color:var(--pri)}
.grid b.cur{border-color:var(--pri)}
.grid b.ok{background:var(--ok-soft);color:var(--ok)}
.grid b.no{background:var(--no-soft);color:var(--no)}
.grid b .d{position:absolute;right:3px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--note)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend .l1::before{background:var(--pri-soft);border:1px solid var(--pri)}
.legend .l2::before{background:var(--ok-soft);border:1px solid var(--ok)}
.legend .l3::before{background:var(--no-soft);border:1px solid var(--no)}
.legend .l4::before{background:var(--bg)}
.legend .l5::before{background:var(--note);border-radius:50%}

/* 交卷 */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--card);border-radius:14px;width:400px;max-width:100%;padding:26px;text-align:center;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal-card .score{font-size:44px;font-weight:800;line-height:1;background:linear-gradient(135deg,#0866ff,#4d9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.modal-card .score small{font-size:15px;font-weight:600;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.modal-card .sub{color:var(--muted);font-size:12.5px;margin-top:7px}
.modal-stats{display:flex;justify-content:center;gap:24px;margin:18px 0 20px}
.modal-stats div{font-size:11.5px;color:var(--muted)}
.modal-stats b{display:block;font-size:18px;color:var(--text)}
.modal-stats .g b{color:var(--ok)}.modal-stats .r b{color:var(--no)}
.modal-actions{display:flex;gap:9px}
.modal-actions .btn{flex:1;justify-content:center;height:40px}

.empty{padding:34px 16px;text-align:center;color:#b3bac5;font-size:12.5px}
.loading{display:flex;align-items:center;justify-content:center;height:100%;gap:9px;color:var(--muted)}
.spin{width:17px;height:17px;border:2.5px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1240px){.detail{flex:0 0 320px}.hstat{display:none}}
@media (max-width:1040px){.detail{display:none}.side{flex:0 0 250px}}

/* ===== 成绩 / 错题库 / 收藏库 ===== */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.statc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.statc b{display:block;font-size:22px;font-weight:800;color:#1d2129;line-height:1.15}
.statc span{font-size:11.5px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.panel-h{padding:11px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-h span{font-weight:400;color:var(--muted);font-size:11.5px}
.rlist{max-height:300px;overflow:auto}
.rrow{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid #f2f4f7;font-size:12.5px}
.rrow:first-child{border-top:0}
.rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-weight:700;white-space:nowrap}
.rd{color:var(--muted);font-size:11px;white-space:nowrap}
.toolbar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qlist{max-height:calc(100vh - 250px);overflow:auto}
.qrow{padding:9px 14px;border-top:1px solid #f2f4f7;cursor:pointer}
.qrow:first-child{border-top:0}
.qrow:hover{background:#fafbfd}
.qt{font-size:13px;color:#1d2129;display:flex;gap:8px;align-items:baseline;line-height:1.5}
.qm{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--muted)}
.kd{color:#0866ff}
.badge{background:#fff1f0;color:#d4380d;border-radius:5px;padding:0 5px}
.sp{flex:1}
.xbtn{border:0;background:transparent;color:#c2c8d2;cursor:pointer;font-size:13px;padding:2px 6px;border-radius:5px}
.xbtn:hover{background:#fff1f0;color:#d4380d}

/* ================= 响应式 ================= */
/* --- 平板 --- */
@media (max-width:1024px){
  .side{flex:0 0 232px}
  .hstat{display:none}
  .search{max-width:none}
  .qwrap{padding:14px 14px 22px}
  .q-title{font-size:16px}
  .opt .v{font-size:14.4px}
}
/* --- 手机：侧栏变抽屉 + 底部导航 --- */
.mobmenu{display:none;flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--bg);color:var(--text);align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.mobmenu:active{background:#e9ecf1}
@media (max-width:700px){.mobmenu{display:flex}}
.mask{position:fixed;inset:0;background:rgba(10,15,25,.42);z-index:55;opacity:0;pointer-events:none;transition:opacity .18s;touch-action:none}
.mask.on{opacity:1;pointer-events:auto}

@media (max-width:700px){
  /* 顶栏：两行（logo + 模式 / 搜索） */
  .topbar{flex:0 0 auto;height:auto;flex-wrap:wrap;padding:7px 10px 8px;row-gap:7px;gap:7px}
  .logo{font-size:14px;flex:0 1 auto;min-width:0;overflow:hidden}
  .logo > span{display:none}
  .spacer{display:none}
  .seg{margin-left:auto;flex:0 0 auto}
  .seg button{padding:4px 10px;font-size:12px}
  .search{flex:1 1 100%;max-width:none;order:9;padding:5px 10px}
  .search input{font-size:13px}
  .hstat{display:none}

  /* 侧栏 -> 抽屉 */
  .side{position:fixed;left:0;top:0;bottom:0;width:86%;max-width:330px;z-index:60;
        transform:translateX(-102%);transition:transform .22s cubic-bezier(.4,0,.2,1);
        box-shadow:6px 0 40px rgba(0,0,0,.18);border-right:1px solid var(--line);flex:none}
  .side.open{transform:none}
  .drawer-hd{display:flex}
  .side-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .side-body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

  /* 主区 */
  .main{padding-bottom:0}
  .main-head{padding:7px 10px;gap:7px}
  .main-head .where{font-size:12px}
  .main-head .btn{height:30px;padding:0 9px;font-size:12px}
  .main-head .pbar{display:none}
  .main-head .where{font-size:12.5px}
  .qwrap{padding:12px 12px 16px}
  .qcard{max-width:none}
  .q-meta{margin-bottom:8px;gap:6px}
  .q-title{font-size:15.2px;line-height:1.78;margin-bottom:12px;padding-right:30px}
  .opt{padding:10px 10px 10px 12px;gap:9px;border-radius:10px}
  .opt .v{font-size:14.1px;line-height:1.62}
  .opt .k{flex:0 0 21px;height:21px;font-size:11.5px}
  .opts{gap:8px}

  /* 工具栏：图标化 + 等宽一行 */
  .tools{padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .tools-inner{gap:4px;max-width:none;flex-wrap:nowrap;overflow:hidden}
  .tools-inner .btn{flex:1 1 0;min-width:0;height:44px;padding:0 2px;font-size:11.5px;line-height:1.12;
    justify-content:center;white-space:normal;word-break:keep-all;overflow:hidden;border-radius:9px;flex-direction:column;gap:2px}
  .tools-inner .btn kbd{display:none}
  .tools-inner .grow,.tools-inner .pos{display:none}
  .tools-inner .btn .ic{font-size:15px;line-height:1}

  /* 面板类 */
  .statgrid{grid-template-columns:repeat(2,1fr);gap:8px}
  .statc{padding:10px 12px}.statc b{font-size:19px}
  .panel{margin-bottom:10px}
  .toolbar{padding:8px 10px;gap:6px}
  .qlist{max-height:none}
  .qrow{padding:9px 11px}
  .qt{font-size:12.6px}
  .qm{font-size:11px}
  .rrow{padding:7px 11px;font-size:12px}
  .rlist{max-height:none}
  .sheet{width:100%;max-width:100vw}
  .cs{width:100%;max-width:100vw}
  .cs-ft textarea{height:48px}
  .cmt-box{margin:12px 0 6px;border-radius:10px;padding:10px 11px 12px}
  .cmt-ft textarea{height:46px}
  .uc-row input{min-width:90px}
  .modal-card{margin:12px;max-width:calc(100vw - 24px)}
  .modal-card .score{font-size:38px}
  .rec-tip{display:none}
}
/* ===== 折叠左侧目录（桌面/平板） ===== */
#foldBtn{display:none;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#5b6270}
@media (min-width:701px){#foldBtn{display:flex}}
.side{transition:flex-basis .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1),padding .22s}
.side.fold{flex:0 0 0!important;width:0!important;min-width:0!important;padding-left:0;padding-right:0;overflow:hidden;border-right:0}
/* ===== 居中确认框（替代原生 confirm） ===== */
.mck{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:10060;display:none;align-items:center;justify-content:center;padding:20px}
.mck.on{display:flex}
.mck-b{background:#fff;border-radius:14px;width:400px;max-width:100%;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(16,24,40,.25);animation:mpop .16s ease}
@keyframes mpop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.mck-t{font-size:15px;font-weight:700;color:#1d2129;margin-bottom:10px}
.mck-c{font-size:13px;color:#5b6270;line-height:1.7;white-space:pre-wrap;margin-bottom:20px}
.mck-f{display:flex;gap:9px}
.mck-f .btn{flex:1;justify-content:center;height:40px}
/* ===== 切题滑动过渡 ===== */
@keyframes slidL{from{transform:translateX(54px);opacity:.35}to{transform:none;opacity:1}}
@keyframes slidR{from{transform:translateX(-54px);opacity:.35}to{transform:none;opacity:1}}
#qwrap.slidL>.qcard{animation:slidL .26s cubic-bezier(.22,.7,.3,1)}
#qwrap.slidR>.qcard{animation:slidR .26s cubic-bezier(.22,.7,.3,1)}
/* ===== 错题本分组 / 首页数据卡 ===== */
.wgrp{background:#fff;border:1px solid var(--line);border-radius:11px;margin:0 0 10px;overflow:hidden}
.wgrp-h{display:flex;align-items:center;gap:8px;padding:10px 13px;background:#fafbfd;font-size:12.8px;font-weight:600}
.wgrp-h:hover{background:#f5f8fd}
.wgrp-h .c{margin-left:auto;font-weight:400;color:var(--muted);font-size:11.5px}
.wgrp-h .go{color:var(--pri);font-weight:600;font-size:11.5px;cursor:pointer}
.wrow{display:flex;gap:9px;align-items:baseline;padding:9px 13px;border-top:1px solid #f2f4f7;font-size:12.5px;cursor:pointer;line-height:1.5}
.wrow:hover{background:#fafbfd}
.wrow .n{flex:0 0 22px;color:#b3bac5;font-size:11px;text-align:right}
.homegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
@media (max-width:700px){.homegrid{grid-template-columns:repeat(2,1fr)}}
/* ===== 苍盾风格答题页（第10条） ===== */
:root{--cd-grad:linear-gradient(135deg,#33b5e6 0%,#1cc8b4 100%);}
/* 卷头：绿竖条卷名 + 青蓝序号 */
.main-head .where b{color:#0b9e86;font-weight:700;position:relative;padding-left:9px}
.main-head .where b::before{content:'';position:absolute;left:0;top:50%;margin-top:-7px;width:3px;height:14px;border-radius:2px;background:#14b98f}
.pbar{height:4px;border-radius:2px;background:#e9edf2}
.pbar i{background:var(--cd-grad)}
.q-num{font-size:12.5px;color:#9aa3af;min-width:52px;text-align:right;white-space:nowrap}
.q-num b{font-size:16px;color:#0aa6c8;font-weight:700;margin-right:2px}
/* 题型：蓝色方括号 */
.qtype{font-size:13px;font-weight:700;color:#2b7fd4;letter-spacing:.3px}
/* 题干 */
.q-title{font-size:16.5px;line-height:1.9;color:#24292f;font-weight:400}
/* 考点条 */
.cd-kd{display:flex;align-items:center;gap:6px;background:#f3f5f8;border-radius:8px;padding:9px 12px;font-size:13px;color:#5b6270;margin:0 0 14px;cursor:pointer;line-height:1.5}
.cd-kd:hover{background:#eef1f6}
.cd-kd .ar{margin-left:auto;color:#b6bdc8;flex:0 0 auto}
.cd-kd.static{cursor:default;opacity:.8}
/* 选项：白卡 + A. 前缀；选中/答对/答错整行渐变 */
.opts{gap:8px}
.opt{padding:13px 14px;border:1px solid #e5e7ec;border-radius:6px;background:#fff;gap:2px;transition:background .12s,border-color .12s}
.opt:hover{background:#fafbfc;border-color:#d2d8e0}
.opt .k{flex:0 0 auto;height:auto;border:0;border-radius:0;background:none;color:#3d4450;font-size:15px;font-weight:600;margin-top:0;display:inline;line-height:1.6}
.opt .k::after{content:'.'}
.opt .v{font-size:15px;line-height:1.6;color:#24292f;font-weight:500}
.opt .o-nbtn{opacity:.3}
.opt.sel{background:var(--cd-grad);border-color:transparent;box-shadow:0 3px 10px rgba(28,200,180,.26)}
.opt.sel .k,.opt.sel .v{color:#fff}
.opt.sel .o-nbtn{opacity:.55;color:#fff}
.opt.ok{background:linear-gradient(135deg,#2fbe86 0%,#17b884 100%);border-color:transparent}
.opt.ok .k,.opt.ok .v{color:#fff}
.opt.ok .o-nbtn{color:#fff;opacity:.55}
.opt.no{background:linear-gradient(135deg,#fb7066 0%,#e5484d 100%);border-color:transparent}
.opt.no .k,.opt.no .v{color:#fff}
.opt.no .o-nbtn{color:#fff;opacity:.55}
/* 确认选项：全宽大按钮，未选灰 / 已选渐变 */
.q-act{flex-direction:column;align-items:stretch;gap:9px}
.q-act .cd-sub{display:flex;align-items:center;justify-content:center;height:46px;border-radius:6px;font-size:15.5px;font-weight:600;background:#eceef1;color:#9aa3af;border:0;width:100%;cursor:not-allowed;transition:.15s;padding:0}
.q-act .cd-sub.on{background:var(--cd-grad);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(28,200,180,.28)}
.q-act .cd-sub .kbd-hint{margin-left:9px;font-size:11px;opacity:.85;border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:1px 5px;font-weight:400}
.q-act .cd-sub:not(.on) .kbd-hint{border-color:rgba(0,0,0,.14)}
.q-act-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
/* 答案条 */
.cd-ansbar{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid #e9ecf1;border-radius:8px;padding:11px 13px;margin:13px 0 0;flex-wrap:wrap}
.cd-ab{display:flex;align-items:baseline;gap:6px}
.cd-ab .lb{font-size:12.5px;color:#8b93a1}
.cd-ab b{font-size:15px;font-weight:700}
.cd-ab b.ok{color:#12a86e}.cd-ab b.no{color:#e5484d}
.cd-addwrong{margin-left:auto;font-size:12.5px;color:#12a86e;background:rgba(28,200,180,.12);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.cd-addwrong:hover{background:rgba(28,200,180,.2)}
/* 解析 tab + 正确率胶囊 */
.cd-dtabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);margin:0 0 12px}
.cd-dtabs span{flex:1;text-align:center;font-size:13.5px;color:#7b8494;padding:10px 0 9px;cursor:pointer;position:relative}
.cd-dtabs span.on{color:#12a86e;font-weight:700}
.cd-dtabs span.on::after{content:'';position:absolute;left:50%;bottom:-1px;margin-left:-11px;width:22px;height:3px;border-radius:2px;background:#12a86e}
.cd-rate{margin-left:8px;font-size:12px;font-weight:600;color:#12a86e;background:rgba(28,200,180,.1);border:1px solid rgba(28,200,180,.32);border-radius:999px;padding:3px 10px;vertical-align:middle}
@media (max-width:700px){
  .q-title{font-size:15.5px;line-height:1.85}
  .opt{padding:11px 12px;border-radius:6px}
  .opt .v{font-size:14.6px}
  .q-act .cd-sub{height:44px;font-size:15px}
  .cd-ansbar{gap:14px;padding:10px 12px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="mobmenu" onclick="openDrawer()" aria-label="菜单"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="logo"><i>冲</i>冲刺模考 <span style="font-size:10.5px;font-weight:500;color:#a3aab6;border:1px solid var(--line);border-radius:4px;padding:0 4px">离线版</span><span id="verTag" style="font-size:10.5px;color:#b8bfca;font-weight:400"></span></div>
  <button class="mobmenu" id="foldBtn" onclick="setSideFold(!S.sideFold)" title="折叠/展开左侧目录" aria-label="折叠目录"><span id="foldIco">«</span></button>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98a0ad" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="gsearch" placeholder="搜索题目 / 考点 / 口诀…" oninput="globalSearch(this.value)">
  </div>
  <div class="spacer"></div>
  <button class="mobmenu" id="ucbtn" onclick="ucOpen()" aria-label="我的" style="display:flex;margin-left:auto" title="我的 / 建议">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.4-6.2 7.5-6.2s7.5 2.2 7.5 6.2"/></svg></button>
  <div class="seg" id="modeseg">
    <button data-m="practice" class="on" onclick="setMode('practice')" title="练习：选好选项 → 点「确认选项」才判对错">练习</button>
    <button data-m="exam" onclick="setMode('exam')" title="考试：选了不判，交卷后统一统分">考试</button>
  </div>
  <div class="hstat" id="hstat"></div>
</header>

<div class="layout">
  <aside class="side">
    <div class="drawer-hd">题目目录<button class="b" onclick="closeDrawer()" aria-label="关闭目录">×</button></div>
    <div class="side-nav">
      <button data-nav="sets" class="on" onclick="switchNav('sets')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg><span>套卷</span></button>
      <button data-nav="tree" onclick="switchNav('tree')"><svg viewBox="0 0 24 24"><path d="M4 6h6M4 12h10M4 18h6"/><circle cx="17" cy="6" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>考点</span></button>
      <button data-nav="mantras" onclick="switchNav('mantras')"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.4.3.5.7.5 1.1v1h6v-1c0-.4.1-.8.5-1.1A6 6 0 0012 3z"/></svg><span>口诀</span></button>
      <button data-nav="notes" onclick="switchNav('notes')"><svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg><span>笔记</span></button>
      <button data-nav="record" onclick="switchNav('record')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>记录</span></button>
    </div>
    <div class="side-body" id="sidebody"></div>
  </aside>

  <main class="main">
    <div class="main-head" id="mainhead"></div>
    <div class="qwrap" id="qwrap"><div class="loading"><span class="spin"></span>加载题库…</div></div>
    <div class="tools" id="tools" style="display:none"></div>

<script>
/* ================= 数据 ================= */
const DB = { meta:{}, books:[], questions:{}, mantras:{}, tree:{} };
const LS_STORE='cd27_desk_v1', LS_NOTE='cd27_notes_v1';
let store = { done:{}, wrong:{}, fav:{}, dk:{}, mt:{}, del:{} };   // dk = 不会；mt=修改时间戳 del=删除时间戳（云端合并用）
let notes = {};
/* ================= 成绩记录 / 错题·收藏库 ================= */
const LS_SCORE='cs3_scores_v1';
function loadScores(){ try{const a=JSON.parse(localStorage.getItem(LS_SCORE)||'[]');return Array.isArray(a)?a:[]}catch(e){return []} }
function saveScores(a){ try{localStorage.setItem(LS_SCORE,JSON.stringify(a))}catch(e){} }
function recordScore(o){ const a=loadScores(); a.push(o); if(a.length>300) a.splice(0,a.length-300); saveScores(a); }
/* 修改/删除时间戳：云端合并时“谁更新谁赢”，删除也能传播到别的设备 */
function stamp(kind,tid){
  store.mt=store.mt||{}; const m=store.mt[kind]=store.mt[kind]||{};
  m[tid]=Date.now(); return m[tid];
}
function untouch(kind,tid){
  const t=Date.now();
  store.mt=store.mt||{}; (store.mt[kind]=store.mt[kind]||{})[tid]=t;
  store.del=store.del||{}; (store.del[kind]=store.del[kind]||{})[tid]=t;
}
function hitWrong(tid){ store.wrong[tid]=(Number(store.wrong[tid])||0)+1; stamp('wrong',tid); }

/* ================= 云端同步（成绩 / 错题 / 收藏） =================
   读：GitHub raw（公开，无需凭据）；写：需本机保存的 GitHub Token。
   合并按时间戳（新的赢），删除用 del 时间戳传播。文件在 records/<同步码>.json */
const LS_CLOUD='cd27_cloud_v1', CLOUD_DIR='records/';
let cloud={key:'',token:'',state:'',busy:false,hold:false,sha:''};
let _syncTimer=null, _syncBusy=false;
function loadCloud(){ try{const c=JSON.parse(localStorage.getItem(LS_CLOUD)||'{}');
  cloud.key=c.key||''; cloud.token=c.token||''; }catch(e){} }
function saveCloud(){ try{localStorage.setItem(LS_CLOUD,JSON.stringify({key:cloud.key,token:cloud.token}))}catch(e){} }
function setCloudState(t){ cloud.state=t; const el=document.getElementById('cloudState'); if(el) el.textContent=t; }
function newSyncKey(){
  const ab=new Uint8Array(9);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(ab);
  else for(let i=0;i<9;i++) ab[i]=Math.floor(Math.random()*256);
  return Array.from(ab).map(function(b){return b.toString(36).padStart(2,'0')}).join('').slice(0,14);
}
function b64enc(str){
  const bytes=new TextEncoder().encode(str); let bin='';
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function cloudFileUrl(){ return 'https://raw.githubusercontent.com/'+SYNC.repo+'/'+SYNC.branch+'/'+CLOUD_DIR+encodeURIComponent(cloud.key)+'.json?t='+Date.now(); }
function cloudApiUrl(){ return 'https://api.github.com/repos/'+SYNC.repo+'/contents/'+CLOUD_DIR+encodeURIComponent(cloud.key)+'.json'; }
function mergeScores(a,b){
  const map={};
  (a||[]).concat(b||[]).forEach(function(x){ if(!x||!x.ts) return; map[x.ts+'_'+(x.title||'')]=x; });
  return Object.keys(map).map(function(k){return map[k]}).sort(function(p,q){return p.ts-q.ts}).slice(-300);
}
/* 把云端记录并进本地：同一 tid 取最新事件（修改或删除），旧的补进来，不覆盖更新的本地 */
function mergeCloud(remote){
  if(!remote) return;
  const R=remote.store||{};
  cloud.hold=true;
  ['done','wrong','fav','dk'].forEach(function(k){
    const cand={};
    [store,R].forEach(function(src){
      src=src||{};
      const m=(src.mt||{})[k]||{}, d=(src.del||{})[k]||{};
      Object.keys(src[k]||{}).forEach(function(tid){
        const t=Number(m[tid])||0;
        if(!cand[tid]||t>cand[tid].t) cand[tid]={t:t,v:src[k][tid],del:false};
      });
      Object.keys(d).forEach(function(tid){
        const t=Number(d[tid])||0;
        if(!cand[tid]||t>cand[tid].t) cand[tid]={t:t,del:true};
      });
    });
    const out={}, mo={}, dl={};
    Object.keys(cand).forEach(function(tid){
      const c=cand[tid];
      if(c.del) dl[tid]=c.t||1;
      else { out[tid]=c.v; mo[tid]=c.t||Date.now(); }
    });
    store[k]=out;
    store.mt=store.mt||{}; store.mt[k]=mo;
    store.del=store.del||{}; store.del[k]=dl;
  });
  saveScores(mergeScores(loadScores(),remote.scores||[]));
  save();
  cloud.hold=false;
}
async function cloudPull(silent){
  if(!cloud.key){ if(!silent) alert('先在「记录 → 云端同步」里设置同步码'); return null; }
  /* ① 登录了评论账号 → 走评论服务（不需要 GitHub Token） */
  if(SUPA_PROGRESS && cmtAuthed()){
    try{
      if(!CMT.ready && !(await cmtInit())) throw new Error('评论服务不可用');
      const j=await cmtApi('/api/progress');
      if(j&&j.data){
        mergeCloud(j.data);
        setCloudState('已同步 '+(j.ts?new Date(j.ts*1000).toLocaleString():''));
        return j.data;
      }
      if(!silent) setCloudState('账号里还没有进度，本机保存后会传上去');
      return null;
    }catch(e){
      if(silent) return null;
      throw new Error('拉取进度失败：'+(e.message||e));
    }
  }
  /* ② 回退：GitHub records/<同步码>.json */
  let data=null;
  if(cloud.token){
    const r=await fetch(cloudApiUrl(),{headers:{Authorization:'Bearer '+cloud.token,Accept:'application/vnd.github+json'},cache:'no-store'});
    if(r.status===404){ data=null; }
    else if(!r.ok){ throw new Error('读取云端失败 HTTP '+r.status+'（Token 权限不足？）'); }
    else { const j=await r.json(); cloud.sha=j.sha||'';
      if(j.content){ try{ data=JSON.parse(b64dec(String(j.content).replace(/\s/g,''))); }catch(e){} } }
  }else{
    const r=await fetch(cloudFileUrl(),{cache:'no-store'});
    if(r.ok){ try{ data=await r.json(); }catch(e){} }
    else if(r.status!==404){ throw new Error('读取云端失败 HTTP '+r.status); }
  }
  if(data&&data.store) mergeCloud(data);
  else if(!data&&!silent) setCloudState('云端还是空的，上传后其他设备才能拉取');
  if(data) setCloudState('已拉取 '+(data.updated?new Date(data.updated).toLocaleString():''));
  return data;
}
async function cloudPush(){
  if(!cloud.key) throw new Error('先设置同步码');
  const payload={v:1,key:cloud.key,updated:Date.now(),
    store:{done:store.done,wrong:store.wrong,fav:store.fav,dk:store.dk,mt:store.mt,del:store.del},
    scores:loadScores()};
  /* ① 登录了评论账号 → 直接传服务端 */
  if(SUPA_PROGRESS && cmtAuthed()){
    if(!CMT.ready && !(await cmtInit())) throw new Error('评论服务不可用');
    await cmtApi('/api/progress',{method:'POST',body:{data:payload}});
    setCloudState('已上传 '+new Date().toLocaleTimeString());
    return;
  }
  if(!cloud.token) throw new Error('登录评论账号（或填 GitHub Token）后才能上传进度');
  let sha=cloud.sha||'';
  const g=await fetch(cloudApiUrl(),{headers:{Authorization:'Bearer '+cloud.token,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(g.ok){ const j=await g.json(); sha=j.sha||''; }
  else if(g.status!==404){ throw new Error('读取云端失败 HTTP '+g.status+'（Token 权限？）'); }
  else sha='';
  const body={message:'sync records '+new Date().toISOString().slice(0,19),content:b64enc(JSON.stringify(payload)),branch:SYNC.branch};
  if(sha) body.sha=sha;
  const r=await fetch(cloudApiUrl(),{method:'PUT',headers:{Authorization:'Bearer '+cloud.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error('上传失败 HTTP '+r.status+' '+t.slice(0,140)); }
  const j=await r.json(); cloud.sha=(j.content&&j.content.sha)||'';
  setCloudState('已上传 '+new Date().toLocaleTimeString());
}
async function cloudSync(auto){
  if(_syncBusy) return; _syncBusy=true; setCloudState('同步中…');
  try{
    await cloudPull(true);
    try{ await cloudPush(); }catch(e){ if(!auto) throw e; setCloudState('本机已保存，稍后自动重试'); return; }
    setCloudState('✓ 已同步 '+new Date().toLocaleTimeString());
    renderAll();
  }catch(e){
    setCloudState('✕ '+(e.message||'同步失败'));
    if(!auto) alert('同步失败：'+(e.message||e));
  }finally{ _syncBusy=false; }
}
function scheduleSync(){   // 只在「交卷后」或手动点同步按钮时才传（刷题过程中不传，省流量）
  if(!S.submitted) return;
  if(cloud.hold||!cloud.key) return;
  if(!cloud.token && !cmtAuthed()) return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){ cloudSync(true); },20000);
}
/* 评论账号登录后就能同步进度（服务端），无需 GitHub Token */
function cmtAuthed(){ try{ return !!(CMT.user && CMT.user.token); }catch(e){ return false; } }
/* 评论账号 ⇄ 云端同步码：登录评论账号后，同步码自动用 u-<uid>，不用再手抄 14 位 */
function cloudUserKey(uid){ return ('u-'+String(uid||'').toLowerCase()).replace(/[^a-z0-9_-]/g,'').slice(0,40); }
async function cloudBindUser(uid){
  const k=cloudUserKey(uid); if(k.length<7) return;
  if(cloud.key===k){ try{ await cloudSync(true); }catch(e){} return; }
  const old=cloud.key;
  if(old && !confirm('把本机记录合并到「评论账号」的同步码？\n\n原同步码 '+old+' 的云端文件不会删除，随时可以切回去。')) return;
  cloud.key=k; saveCloud();
  try{ await cloudPull(true); }catch(e){}
  try{ await cloudPush(); }catch(e){}
  setCloudState('已绑定账号，进度自动同步');
  try{ renderAll(); }catch(e){}
}

function cloudSetupKey(){
  const cur=cloud.key||'';
  const v=prompt('同步码（换设备输入同一个码即可共享记录）\n留空 = 自动生成新码；新码就是新的云端文件',cur);
  if(v==null) return;
  let k=v.trim();
  if(!k) k=newSyncKey();
  if(!/^[a-z0-9_-]{6,40}$/i.test(k)) return alert('同步码只能是字母、数字、- 或 _，6–40 位');
  cloud.key=k; cloud.sha=''; saveCloud(); renderAll();
  if(!cur||cur!==k) alert('同步码：'+k+'\n\n复制保存，其他设备输入它就能看到同一份错题/成绩。');
}
function cloudSetupToken(){
  const v=prompt('GitHub Token（fine-grained，仅本仓库 Contents: Read and write）\n留空 = 不变；输入 - = 清除（清除后只能只读拉取）','');
  if(v==null) return;
  const t=v.trim();
  if(t==='-'){ cloud.token=''; saveCloud(); renderAll(); return; }
  if(!t) return;
  cloud.token=t; saveCloud(); renderAll();
  alert('Token 已只保存在本机浏览器。注意：别在公用电脑上设置。');
}
function cloudBar(){
  const on=!!cloud.key, tk=!!cloud.token, au=cmtAuthed();
  let nick='';
  try{ nick=(CMT.user&&CMT.user.nick)||''; }catch(e){}
  return '<div class="panel"><div class="panel-h">进度同步 · 多设备'
    +'<span id="cloudState">'+esc(cloud.state||(au?'已登录':(on?(tk?'已设置':'只读'):'未登录')))+'</span></div>'
    +'<div style="padding:11px 14px;font-size:12.5px;line-height:1.85;color:#5b6270">'
    +'<div>账号：'+(au?('<b style="color:#12a150">'+esc(nick)+'</b>　登录即同步'):'<b style="color:#e08a00">未登录</b>（去顶栏 👤 登录）')
      +'　同步码：<b style="font-family:ui-monospace,Consolas,monospace;color:#2c3140">'
      +(on?esc(cloud.key.slice(0,6)+'…'+cloud.key.slice(-4)):'—')+'</b></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px">'
      +'<button class="btn pri" onclick="cloudSync(false)">立即同步</button>'
      +'<button class="btn line" onclick="cloudPush().then(function(){setCloudState(\'✓ 已上传 \'+new Date().toLocaleTimeString())}).catch(function(e){alert(e.message)})">立即上传</button>'
      +'<button class="btn line" onclick="cloudSetupToken()">设置 Token（可选）</button>'
    +'</div>'
    +'<div style="color:#98a0ad;font-size:11.5px;line-height:1.7;margin-top:8px">'
      +'<b>登录刷题账号就自动同步</b>，换设备登同一个账号即可拿到成绩/错题/收藏（不需要 Token）。'
      +'改了题或交卷后 15 秒自动上传。没网时先存本机，联网自动补。'
      +'也可填 GitHub Token 把记录存到公开仓库的 <code>records/</code>（旧的备份方式）。'
    +'</div></div></div>';
}

function closeDrawer(){

/* 遮罩只在“轻点”时关目录；手指滑动（想滑动页面/误触）不算，避免手机上一碰就退出 */
var _mkS={x:0,y:0,t:0,sw:false};
function maskDown(e){
  var t=e.touches&&e.touches[0]; if(!t) return;
  _mkS={x:t.clientX,y:t.clientY,t:Date.now(),sw:false};
}
function maskUp(e){
  var t=e.changedTouches&&e.changedTouches[0]; if(!t) return;
  if(Math.abs(t.clientX-_mkS.x)>12||Math.abs(t.clientY-_mkS.y)>12||Date.now()-_mkS.t>500) _mkS.sw=true;
  setTimeout(function(){ _mkS.sw=false; },450);
}
function maskSwiped(){ return _mkS.sw; }

let _ckOk=null;
function uiConfirm(text, onOk, opt){
  opt=opt||{};
  let m=document.getElementById('mck');
  if(!m){ m=document.createElement('div'); m.id='mck'; m.className='mck'; document.body.appendChild(m); }

    +'<button class="btn '+(opt.danger?'danger':'pri')+'" onclick="uiConfirmOk()">'+(opt.okText||'确定')+'</button></div></div>';

}
function uiConfirmClose(){ const m=document.getElementById('mck'); if(m) m.classList.remove('on'); _ckOk=null; }

function qOrderMap(){                       // tid → 在题库里的全局顺序（= 讲义/考点顺序）
  if(S._qord) return S._qord;
  const m={}; let i=0;
  (DB.books||[]).forEach(function(b){ (b.sets||[]).forEach(function(s){
    (s.items||[]).forEach(function(t){ if(!(t in m)) m[t]=i++; });
  }); });
  S._qord=m; return m;
}
function setMap(){                          // tid → 所在套卷名
  if(S._setmap) return S._setmap;
  const m={};
  (DB.books||[]).forEach(function(b){ (b.sets||[]).forEach(function(s){
    const nm=String(b.name||'').replace('（已更新）','')+' · '+s.set;
    (s.items||[]).forEach(function(t){ if(!m[t]) m[t]=nm; });
  }); });
  S._setmap=m; return m;
}
function bumpStat(tid, ok){                 // 题级正确率：每次判定+1
  store.hist=store.hist||{};
  const h=store.hist[tid]||{n:0,ok:0};
  h.n++; if(ok) h.ok++;
  store.hist[tid]=h;
}
function tidRate(tid){
  const h=(store.hist||{})[tid];
  if(!h||!h.n) return null;
  return {pct:Math.round(h.ok/h.n*100), n:h.n, ok:h.ok};
}

function scoreChart(data){
  if(!data.length) return '<div class="empty" style="padding:26px;font-size:12.5px">交卷后这里会出现折线图</div>';
  const W=560,H=150,pl=36,pr=12,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,n=data.length;
  const pts=data.map(function(d,i){
    const r=d.full?d.score/d.full:0;
    const x=pl+(n===1?iw/2:iw*i/(n-1));
    return [x,pt+ih*(1-r),r];
  });
  const line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  const area=line+' L'+pts[n-1][0].toFixed(1)+','+(pt+ih)+' L'+pts[0][0].toFixed(1)+','+(pt+ih)+' Z';
  let grid='';
  [0,0.5,1].forEach(function(g){
    const y=pt+ih*(1-g);

const SYNC = { repo:'linyunshen0-hue/n27-sync', branch:'main', baseUrl:'https://linyunshen0-hue.github.io/n27-sync' };   // 例：'linyunshen0-hue/n27-sync'
function syncBase(){
  if(SYNC.baseUrl) return SYNC.baseUrl.replace(/\/$/,'');
  if(!SYNC.repo) return '';
  return 'https://cdn.jsdelivr.net/gh/'+SYNC.repo+'@'+SYNC.branch;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('cd27db',1);
    r.onupgradeneeded=()=>{ try{r.result.createObjectStore('kv');}catch(e){} };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function withTimeout(p, ms, fallback){
  return Promise.race([p.catch(()=>fallback), new Promise(r=>setTimeout(()=>r(fallback), ms))]);
}
function idbGet(k){
  return withTimeout((async()=>{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const t=db.transaction('kv','readonly').objectStore('kv').get(k);
      t.onsuccess=()=>res(t.result||null); t.onerror=()=>rej(t.error);
    });
  })(), 1500, null);
}
function idbSet(k,v){
  return withTimeout((async()=>{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);
      t.onsuccess=()=>res(true); t.onerror=()=>rej(t.error);
    });
  })(), 4000, false);
}
async function gunzipBuf(buf){
  const ds=new DecompressionStream('gzip');
  return await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
}
async function checkUpdate(){
  const base=syncBase();
  if(!base) return;
  try{
    const vr=await fetch(base+'/version.json?t='+Date.now(),{cache:'no-store'});
    if(!vr.ok) return;
    const v=await vr.json();
    const cur=(DB.meta&&DB.meta.version)||'';
    const curB=(DB.meta&&DB.meta.built)||'';
    const curN=(DB.meta&&DB.meta.total)||0;
    // version / built / total 任一变化都算更新（同一天多次 rebuild 时 version 不变）
    if(!v.version) return;
    if(v.version===cur && (v.built||'')===curB && (v.total||0)===curN) return;
    const dr=await fetch(base+'/'+(v.file||'d.json.gz')+'?t='+Date.now(),{cache:'no-store'});
    if(!dr.ok) return;
    const txt=await gunzipBuf(await dr.arrayBuffer());
    const nd=JSON.parse(txt);
    await idbSet('data', nd);
    showUpdateBar(nd.meta||v);
  }catch(e){ console.warn('[sync] 检查更新失败', e); }
}

/* ================= 考点索引 ================= */
function buildIndex(){
  const byKd = {};   // kaodian_id -> [tid]
  const cnt = {};    // kaodian_id -> n（含子孙）
  Object.entries(DB.questions).forEach(([t,q])=>{
    const k=q.kaodian_id||'';
    (byKd[k]=byKd[k]||[]).push(t);
    if(k) cnt[k]=(cnt[k]||0)+1;
  });
  // 向上累加（按深度从深到浅，先子后父）
  const depth=k=>{ let d=0,cur=k,seen=new Set(); while(cur&&DB.tree[cur]&&!seen.has(cur)){seen.add(cur);const p=DB.tree[cur][1];if(!p||!DB.tree[p])break;cur=p;d++;} return d; };
  const deps={}; Object.keys(DB.tree).forEach(k=>deps[k]=depth(k));
  Object.keys(DB.tree).sort((a,b)=>deps[b]-deps[a]).forEach(k=>{
    const p=DB.tree[k][1];
    if(p&&DB.tree[p]&&cnt[k]) cnt[p]=(cnt[p]||0)+cnt[k];
  });
  S.qIndex={byKd,cnt};
}
function kids(id){ return Object.keys(DB.tree).filter(k=>DB.tree[k][1]===id); }
function rootOf(id){
  let cur=id, seen=new Set();
  while(cur && DB.tree[cur] && !seen.has(cur)){
    seen.add(cur);
    const p=DB.tree[cur][1];
    if(!p || !DB.tree[p]) return cur;
    cur=p;
  }
  return cur;
}
function sameKaodian(tid){
  const q=DB.questions[tid];
  if(!q||!q.kaodian_id) return [];
  return (S.qIndex.byKd[q.kaodian_id]||[]).filter(t=>t!==tid);
}

/* ================= 数据加载（在线版：优先 IndexedDB 缓存） ================= */
async function loadData(){
  if(window.__DEMO__ && window.__DEMO__.meta) return window.__DEMO__;   // 截图/自检用的小题库（_preview.py 注入），正常使用不存在
  const cached=await idbGet('data');
  if(cached && cached.meta) return cached;
  // ① 本地版：冲刺题库/题库.json；② 在线版：同目录 d.json.gz（解压）
  let r=await fetch('冲刺题库/题库.json',{cache:'no-cache'}).catch(()=>null);
  if(r&&r.ok) return await r.json();
  r=await fetch('d.json.gz',{cache:'no-cache'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return JSON.parse(await gunzipBuf(await r.arrayBuffer()));
}

/* 考点树：科目 → 章 → 节 → 考点 */
function sideTree(){
  const roots=Object.keys(DB.tree).filter(k=>{const p=DB.tree[k][1];return !p||!DB.tree[p];});
  let h=`<div class="side-title">考点树 · ${Object.keys(DB.tree).length} 节点</div>
         <div class="li" onclick="S.openTree=new Set(Object.keys(DB.tree));renderSide()"><span class="t">全部展开</span></div>
         <div class="li" onclick="S.openTree=new Set();renderSide()"><span class="t">全部折叠</span></div>`;
  const walk=(id,lv)=>{
    const [title]=DB.tree[id];
    const c=S.qIndex.cnt[id]||0;
    const ch=kids(id);
    const open=S.openTree.has(id);
    const byKd=(S.qIndex.byKd[id]||[]).length;
    h+=`<div class="li lv${Math.min(lv,4)}" onclick="${ch.length?`toggleTree('${id}')`:''}">
        <span class="tw ${open?'open':''}">${ch.length?'▶':''}</span>
        <span class="t" title="${esc(title)}">${esc(title)}</span>
        ${c?`<span class="c" style="color:var(--pri);font-weight:600" onclick="event.stopPropagation();killNode('${id}')">刷</span>`:''}
        <span class="c">${c||''}</span></div>`;
    if(ch.length&&open) ch.forEach(k=>walk(k,lv+1));
  };
  roots.filter(k=>(S.qIndex.cnt[k]||0)>0).forEach(k=>walk(k,1));
  return h;
}
function toggleTree(id){ if(S.openTree.has(id)) S.openTree.delete(id); else S.openTree.add(id); renderSide(); }

function sideMantras(){
  const rows=[]; Object.entries(DB.mantras).forEach(([t,l])=>l.forEach(m=>rows.push({t,...m})));
  // 按考点顺序 = 题目在题库里的顺序（题库本身就是讲义/考点顺序）
  const ord=qOrderMap();
  rows.sort((a,b)=>((ord[a.t]??9e9)-(ord[b.t]??9e9))||(b.q-a.q)||(b.text.length-a.text.length));
  const only3=S._only3!==false;
  let h=`<div class="side-title">${rows.length} 条口诀</div>
    <div class="li" onclick="S._only3=${!only3};renderSide()"><span class="t">${only3?'☑':'☐'} 只看 ★★★</span><span class="c">${rows.filter(r=>r.q===3).length}</span></div>`;
  rows.filter(r=>!only3||r.q===3).slice(0,100).forEach(r=>{
    h+=`<div class="li" onclick="openMantra('${r.t}')"><span class="t" style="font-size:12.3px;line-height:1.45;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(r.text)}</span><span class="c">${'★'.repeat(r.q)}</span></div>`;
  });
  return h;
}

function sideNotes(){
  const keys=Object.keys(notes).filter(k=>noteText(k).trim());
  if(!keys.length) return `<div class="side-title">笔记</div><div class="empty">还没有笔记<br><br>题干右上 📝 或选项右侧 📝 就能写</div>`;
  let h=`<div class="side-title">${keys.length} 条笔记</div>
    <div class="li" onclick="exportNotes()"><span class="t">⤓ 导出全部笔记</span></div>`;
  keys.forEach(k=>{
    const tid=k.split('|')[0], opt=k.split('|')[1];
    const q=DB.questions[tid]||{};
    const label=opt?`${tid} 选项${opt}`:tid;
    h+=`<div class="li" onclick="jumpNote('${k}')" style="align-items:flex-start">
      <span class="t" style="font-size:12.3px;line-height:1.5;white-space:normal">
        <b style="color:var(--note)">${label}</b> ${opt?'':''}
        <span style="display:block;color:#5b6270;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(noteText(k))}</span>
        <span style="display:block;color:#a3aab6;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((q.kaodian||'').slice(0,18))}</span>
      </span></div>`;
  });
  return h;
}
function noteText(k){ const v=notes[k]; return v&&typeof v==='object'? (v.text||'') : (v||''); }
function jumpNote(k){
  if(typeof closeDrawer==='function') closeDrawer();
  const tid=k.split('|')[0], opt=k.split('|')[1];
  if(S.quiz){ S.hist.push({quiz:{ids:S.quiz.ids,title:S.quiz.title},idx:S.idx}); if(S.hist.length>30) S.hist.shift(); }
  S.quiz={ids:[tid],title:'笔记关联题'}; S.idx=0; S.answers={}; S.revealed={[tid]:true}; S.submitted=false;
  renderAll();
  if(opt) setTimeout(()=>{ const btn=document.querySelector(`.opt[data-k="${opt}"] .o-nbtn`); if(btn) editNote(tid,'opt:'+opt,btn); },120);
}

function sideRecord(){

/* ================= 刷题 ================= */
function startQuizBySet(bi,si){ if(typeof closeDrawer==='function') closeDrawer(); const b=DB.books[bi],s=b.sets[si];
  S.hist=[];                       // 从左侧选卷 = 新起点，清空返回栈
  if(!isMob()) setSideFold(true);   // 选好卷子后强制折叠左侧目录（给题目让宽，可再点开）
  s.items.forEach(t=>{ delete S.answers[t]; delete S.revealed[t]; });  // 重刷：清这一套的旧作答
  startQuiz(s.items, b.name.replace('（已更新）','')+' · '+s.set, null, true); }
function startQuiz(ids,title,atTid,resetHist){ if(typeof closeDrawer==='function') closeDrawer();
  if(!ids||!ids.length) return;
  if(!resetHist && S.quiz && (S.quiz.ids!==ids || S.quiz.title!==title)){
    S.hist.push({quiz:{ids:S.quiz.ids,title:S.quiz.title}, idx:S.idx});
    if(S.hist.length>30) S.hist.shift();
  }
  // 注意：不重置 answers/revealed —— 它们按 tid 全局存，串题/返回都不丢作答
  S.quiz={ids:ids.slice(),title}; S.idx=atTid?Math.max(0,ids.indexOf(atTid)):0;
  S.submitted=false; closeNote(); renderAll();
}
function backOne(){
  closeNote(); closeSheet();
  if(S.hist.length){ const p=S.hist.pop(); S.quiz=p.quiz; S.idx=p.idx; renderAll(); return; }
  S.quiz=null; renderAll();
}
function openMantra(tid){
  if(typeof closeDrawer==='function') closeDrawer();
  if(S.quiz){ S.hist.push({quiz:{ids:S.quiz.ids,title:S.quiz.title},idx:S.idx}); if(S.hist.length>30) S.hist.shift(); }
  S.quiz={ids:[tid],title:'口诀关联题'}; S.idx=0; S.answers={}; S.revealed={[tid]:true}; S.submitted=false;
  renderAll();
}

    <div class="q-title">${esc(q.title)}

    ${stemNote?`<div style="background:var(--note-soft);border-left:3px solid var(--note);border-radius:7px;padding:8px 11px;margin:-6px 0 14px;font-size:13px;line-height:1.65;color:#4b3a7a;white-space:pre-wrap">${esc(stemNote)}</div>`:''}

      <span class="o-nbtn ${has?'has':''}" title="选项笔记" onclick="event.stopPropagation();editNote('${tid}','opt:${k}',this)">📝</span>

function pick(k){
  if(S._swiped && Date.now()-S._swiped < 300) return;
  if(!S.quiz || S.submitted) return;
  const tid=S.quiz.ids[S.idx],q=DB.questions[tid];
  let arr=S.answers[tid]||[];
  if(q.type==='多选'){ arr=arr.includes(k)?arr.filter(x=>x!==k):arr.concat(k); }
  else arr=[k];
  S.answers[tid]=arr.sort();
  S.revealed[tid]=false;      // 改选后回到“未判定”，要重新提交才判
  if(S.judged) delete S.judged[tid];
  renderAll();
}
/* 提交本题：练习模式判分+写错题本；考试模式不判，只记答案 */
function submitOne(){
  if(!S.quiz||S.submitted) return;
  const tid=S.quiz.ids[S.idx], q=DB.questions[tid], a=S.answers[tid]||[];
  if(!a.length) return alert(q.type==='多选'?'多选题：至少选一项再提交':'先选一个选项再提交');
  if(S.mode==='exam'){ S.revealed[tid]=false; renderAll(); next(); return; }
  S.revealed[tid]=true; rec(tid,a); S.judged=S.judged||{}; S.judged[tid]=true; save(); renderAll();
  setTimeout(function(){ const d=document.getElementById('mobDetail');
    if(d && isMob()) d.scrollIntoView({behavior:'smooth',block:'start'}); },70);
}
/* 重选：撤掉本题判定，答案保留 */
function clearAnswer(){
  if(!S.quiz||S.submitted) return;
  const tid=S.quiz.ids[S.idx];
  delete S.revealed[tid]; if(S.judged) delete S.judged[tid]; renderAll();
}
/* 重新刷题：清空本卷作答与判定（错题本、成绩记录不动） */
function resetQuiz(){
  if(!S.quiz) return;
  const ids=S.quiz.ids;
  uiConfirm('重做本卷（'+ids.length+' 题）？\n\n会清空本卷的作答和判定；错题本与成绩记录保留，重做答对会自动移出错题本。', function(){
    ids.forEach(t=>{ delete S.answers[t]; delete S.revealed[t]; if(S.judged) delete S.judged[t]; if(store.done) delete store.done[t]; });
    S.submitted=false; S.idx=0; S._lastTid=null;
    save(); renderAll();
  }, {title:'重做本卷', okText:'重做'});
}
function rec(tid,arr){
  const q=DB.questions[tid], ok=isRight(q,arr);
  bumpStat(tid, ok);
  store.done[tid]= ok?'ok':'no'; stamp('done',tid);
  if(ok){ delete store.wrong[tid]; untouch('wrong',tid); delete (store.dk||{})[tid]; untouch('dk',tid); } else hitWrong(tid);
  save();
}
function dontKnow(){
  if(!S.quiz) return;
  const tid=S.quiz.ids[S.idx], q=DB.questions[tid];
  store.dk=store.dk||{}; store.dk[tid]=1; stamp('dk',tid); hitWrong(tid); store.done[tid]='no'; stamp('done',tid); bumpStat(tid,false); save();
  const rel=sameKaodian(tid);
  if(!rel.length){ alert('这个考点只有这一道题（题库里没有同类题）'); renderAll(); return; }
  startQuiz(rel,'同考点：'+(q.kaodian||''));
}
function sameGo(tid){ const q=DB.questions[tid]||{}; startQuiz(sameKaodian(tid),'同考点：'+(q.kaodian||'')); }
function killNode(id){
  const out=[];
  const walk=n=>{ (S.qIndex.byKd[n]||[]).forEach(t=>out.push(t)); kids(n).forEach(walk); };
  walk(id);
  if(!out.length) return;
  const t=DB.tree[id]?DB.tree[id][0]:id;
  startQuiz(out, '考点：'+t);
}
function killKaodian(kid){
  if(!kid) return;
  const ids=(S.qIndex.byKd[kid]||[]).slice();
  if(!ids.length) return;
  const q=DB.questions[ids[0]]||{};
  startQuiz(ids, '考点：'+(q.kaodian||kid));
}
function openRel(fromTid, target){
  const q=DB.questions[fromTid]||{};
  const ids=sameKaodian(fromTid).slice();
  startQuiz(ids, '同考点：'+(q.kaodian||''), target);
}
function revealNow(){ if(!S.quiz) return; S.revealed[S.quiz.ids[S.idx]]=true; renderAll(); }

/* ================= 交卷 ================= */
function submit(){
  if(!S.quiz) return;
  const ids=S.quiz.ids; let sc=0,full=0,okN=0,noN=0,blank=0;
  ids.forEach(t=>{
    const q=DB.questions[t], pt=q.type==='多选'?2:1; full+=pt;
    const a=S.answers[t]||[];
    bumpStat(t, a.length && isRight(q,a));
    if(!a.length){ blank++; store.done[t]='no'; stamp('done',t); hitWrong(t); return; }
    if(isRight(q,a)){ sc+=pt; okN++; store.done[t]='ok'; stamp('done',t); delete store.wrong[t]; untouch('wrong',t); }
    else { noN++; store.done[t]='no'; stamp('done',t); hitWrong(t); }
  });
  save(); recordScore({ts:Date.now(),title:S.quiz.title,score:sc,full:full,ok:okN,no:noN,blank:blank,n:ids.length,mode:S.mode}); S.submitted=true; ids.forEach(t=>S.revealed[t]=true); renderAll();
  scheduleSync();   // 交卷后自动同步一次进度
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="modal-card"><div class="score">${sc}<small> / ${full}</small></div>
    <div class="sub">${esc(S.quiz.title)}</div>
    <div class="modal-stats"><div class="g"><b>${okN}</b>正确</div><div class="r"><b>${noN}</b>错误</div><div><b>${blank}</b>未答</div></div>
    <div class="modal-actions"><button class="btn line" onclick="this.closest('.modal').remove()">关闭</button>
      <button class="btn line" onclick="this.closest('.modal').remove();resetQuiz()">重做本卷</button>
      <button class="btn pri" onclick="this.closest('.modal').remove();S.idx=0;renderAll()">逐题看解析</button></div></div>`;
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m);
}

function cmtApplyLocal(kind,cid,on){
  CMT.me=CMT.me||{like:[],dislike:[],star:[],pin:[]};
  ['like','dislike','star'].forEach(function(k){ if(!Array.isArray(CMT.me[k])) CMT.me[k]=[]; });
  const had=CMT.me[kind].indexOf(cid)>=0;
  if(on){ if(!had) CMT.me[kind].push(cid);
    if(kind==='like'||kind==='dislike'){
      const op=kind==='like'?'dislike':'like';
      const i=CMT.me[op].indexOf(cid); if(i>=0) CMT.me[op].splice(i,1);
    }
  }else{ CMT.me[kind]=CMT.me[kind].filter(function(x){return x!==cid}); }
  const c=(CMT.list||[]).filter(function(x){return x.id===cid})[0];
  if(c){
    const key=kind==='like'?'likes':(kind==='dislike'?'dislikes':'stars');
    if(on&&!had) c[key]=(Number(c[key])||0)+1;
    if(!on&&had) c[key]=Math.max(0,(Number(c[key])||0)-1);
  }
}

function cmtFetchJson(url, ms){
  return new Promise(function(res, rej){
    const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    const t=setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} rej(new Error('timeout')); }, ms||9000);
    fetch(url,{cache:'no-store', signal: ctl?ctl.signal:undefined})
      .then(function(r){ clearTimeout(t); res(r); })
      .catch(function(e){ clearTimeout(t); rej(e); });
  });
}
/* 隧道地址解析：优先 api.github.com contents（**实时，不走 CDN 缓存**），
   再回退 raw.githubusercontent / Pages（这两个可能滞后几分钟）。
   地址每次重连都会变，这是之前“时好时坏”的根因。 */
async function cmtResolveBase(){
  try{
    const r=await cmtFetchJson('https://api.github.com/repos/'+SYNC.repo+'/contents/api.json?t='+Date.now(), 9000);
    if(r.ok){
      const j=await r.json();
      if(j&&j.content){
        const o=JSON.parse(b64dec(String(j.content).replace(/\s/g,'')));
        if(o&&o.api){ CMT.addrSrc='gh-api'; return String(o.api).replace(/\/$/,''); }
      }
    }
  }catch(e){}
  const urls=['https://raw.githubusercontent.com/'+SYNC.repo+'/'+SYNC.branch+'/api.json',
              'https://linyunshen0-hue.github.io/n27-sync/api.json'];
  for(let i=0;i<urls.length;i++){
    try{
      const r=await cmtFetchJson(urls[i]+'?t='+Date.now(), 9000);
      if(!r.ok) continue;
      const o=await r.json();
      if(o&&o.api){ CMT.addrSrc=(i?'pages':'raw'); return String(o.api).replace(/\/$/,''); }
    }catch(e){}
  }
  return '';
}
