/* ---- ② 原本机后端调用（保留：电脑开着 / 局域网时仍然走它，最快） ---- */
async function localApi(path, opt){
  opt = opt || {};
  const h = { 'Content-Type': 'application/json' };
  if (CMT.user && CMT.user.token) h.Authorization = 'Bearer ' + CMT.user.token;
  const r = await fetch(cmtUrl(path), {
    method: opt.method || 'GET', headers: h,
    body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store'
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.err || ('HTTP ' + r.status));
  return j;
}

/* ---- ③ Supabase 底层：Auth 请求（不带 Bearer）、REST 请求（带 Bearer + 401 自动刷新） ---- */
async function supaAuth(path, body){
  const r = await fetch(SUPA.url + '/auth/v1' + path, {
    method: 'POST',
    headers: { apikey: SUPA.key, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}), cache: 'no-store'
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    // GoTrue 的报错字段五花八门，统一翻成人话
    const msg = j.msg || j.message || j.error_description || j.error || ('HTTP ' + r.status);
    if (/already registered|already exists/i.test(msg)) throw new Error('这个昵称已被占用');
    if (/invalid login credentials|invalid_grant/i.test(msg)) throw new Error('昵称或密码不对');
    if (/password/i.test(msg) && /least|short|6/i.test(msg)) throw new Error('密码至少 6 位');
    throw new Error(msg);
  }
  return j;
}

async function supaRefresh(){
  const u = CMT.user;
  if (!u || !u.refresh) return false;
  try {
    const j = await supaAuth('/token?grant_type=refresh_token', { refresh_token: u.refresh });
    u.token = j.access_token; u.refresh = j.refresh_token || u.refresh;
    u.exp = Date.now() + (j.expires_in || 3600) * 1000;
    if (j.user && j.user.id) u.uid = j.user.id;
    cmtSaveUser(u);
    return true;
  } catch (e) { return false; }
}

async function supaRpc(fn, args, retried){
  const h = { 'Content-Type': 'application/json', apikey: SUPA.key };
  if (CMT.user && CMT.user.token) h.Authorization = 'Bearer ' + CMT.user.token;
  const r = await fetch(SUPA.url + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: h, body: JSON.stringify(args || {}), cache: 'no-store'
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  // access token 默认 1 小时过期 → 401 时用 refresh_token 续一次再重试
  if (r.status === 401 && !retried && await supaRefresh()) return supaRpc(fn, args, true);
  if (!r.ok) throw new Error(j.message || j.hint || j.error || ('HTTP ' + r.status));
  return j;
}

async function supaPing(){
  try {
    const r = await fetch(SUPA.url + '/rest/v1/rpc/health', {
      method: 'POST', cache: 'no-store',
      headers: { apikey: SUPA.key, Authorization: 'Bearer ' + SUPA.key, 'Content-Type': 'application/json' },
      body: '{}'
    });
    return r.ok;
  } catch (e) { return false; }
}

/* ---- ④ 新版 cmtInit：同源（局域网）→ Supabase（云端）→ 隧道（兜底） ----
   顺序说明：把 Supabase 放在隧道前面，是为了让“电脑关机”时手机 4G 打开页面
   秒进云端，而不用先等隧道地址解析 + 探活超时（之前那样要白等 10 多秒）。
   隧道降级为最后一级，只在 Supabase 暂停/挂了时顶上来（此时需要电脑开着）。 */
async function cmtInit(){
  if (CMT.ready) return true;
  const _fj = (typeof cmtFetchJson === 'function')
    ? cmtFetchJson
    : function (u, ms) { return fetch(u, { cache: 'no-store' }); };

  // 1) 同源本机后端（局域网 http://192.168.x.x:8795，最快）
  try {
    const r = await _fj('/api/health', 3000);
    if (r.ok) { CMT.base = ''; CMT.mode = 'local'; CMT.addrSrc = 'same-origin'; CMT.ready = true; return true; }
  } catch (e) {}

  // 2) Supabase（云端，电脑关机也能用）—— 先 ping 一下，避免项目被暂停时卡在这里
  if (SUPA.url && SUPA.key && SUPA.url.indexOf('xxxx') < 0) {
    if (await supaPing()) {
      CMT.base = SUPA.url; CMT.mode = 'supa'; CMT.addrSrc = 'supabase'; CMT.ready = true; return true;
    }
  }

  // 3) 公网隧道（api.json，由 tunnel.py 写入）—— 兜底，需要那台电脑开着
  //    地址解析复用页面的 cmtResolveBase()：api.github.com 实时 → raw → Pages，带超时
  try {
    if (typeof cmtResolveBase === 'function') {
      const base = await cmtResolveBase();
      if (base) {
        try {
          const h = await _fj(base + '/api/health', 5000);
          if (h.ok) { CMT.base = base; CMT.mode = 'local'; CMT.ready = true; return true; }
        } catch (e) {}
      }
    }
  } catch (e) {}

  return false;
}

/* ---- ⑤ 新版 cmtApi：签名不变，内部路由 ---- */
async function cmtApi(path, opt){
  opt = opt || {};
  if (!CMT.ready) await cmtInit();
  if (CMT.mode !== 'supa') return localApi(path, opt);

  const method = (opt.method || 'GET').toUpperCase();
  const b = opt.body || {};
  let m, j, s;

  /* --- 账号 --- */
  if (path === '/api/reg' || path === '/api/login') {
    const nick = String(b.nick || '').trim();
    const pass = String(b.pass || '');
    const email = supaEmail(nick);
    if (path === '/api/reg') {
      if (nick.length < 2 || nick.length > 16) throw new Error('昵称 2–16 位');
      if (pass.length < 6) throw new Error('密码至少 6 位');
      j = await supaAuth('/signup', { email: email, password: pass, data: { nick: nick } });
      s = j.session || (j.access_token ? j : null);
      if (!s) throw new Error('注册成功但没拿到登录态：请到 Supabase → Authentication → Providers → Email 关闭 Confirm email');
    } else {
      j = await supaAuth('/token?grant_type=password', { email: email, password: pass });
      s = j;
    }
    const uid = (s.user && s.user.id) || '';
    const nm = (s.user && s.user.user_metadata && s.user.user_metadata.nick) || nick;
    cmtSaveUser({ token: s.access_token, refresh: s.refresh_token, uid: uid, nick: nm,
                  exp: Date.now() + (s.expires_in || 3600) * 1000 });
    return { ok: true, token: s.access_token, uid: uid, nick: nm };
  }
  if (path === '/api/nick') {
    j = await supaRpc('set_nick', { p_nick: String(b.nick || '').trim() });
    return { ok: true, nick: j.nick };
  }
  if (path === '/api/pass') {
    const u = CMT.user; if (!u || !u.token) throw new Error('请先登录');
    const r = await fetch(SUPA.url + '/auth/v1/user', {
      method: 'PUT',
      headers: { apikey: SUPA.key, Authorization: 'Bearer ' + u.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: String(b.new || '') }), cache: 'no-store'
    });
    let e = {}; try { e = await r.json(); } catch (x) {}
    if (!r.ok) throw new Error(e.msg || e.message || '改密码失败（新密码至少 6 位）');
    return { ok: true, token: u.token, uid: u.uid, nick: u.nick };
  }

  /* --- 读 --- */
  if (path === '/api/health') return supaRpc('health', {});
  if ((m = path.match(/^\/api\/c\/([\w@.-]{1,60})$/)) && method === 'GET')
    return supaRpc('list_comments', { p_tid: m[1] });
  if (path === '/api/suggest') return supaRpc('list_comments', { p_tid: '@suggest' });
  if (path === '/api/progress' && method === 'GET') return supaRpc('get_progress', {});
  if ((m = path.match(/^\/api\/mine\/([\w@.-]{1,60})$/)))
    return { ok: true, me: CMT.user ? null : null };

  /* --- 写 --- */
  if (path === '/api/c' && method === 'POST')
    return supaRpc('post_comment', { p_tid: String(b.tid || ''), p_text: String(b.text || ''),
                                     p_reply_to: b.reply_to || null });
  if ((m = path.match(/^\/api\/c\/([\w.-]{1,60})$/)) && method === 'DELETE')
    return supaRpc('del_comment', { p_cid: m[1] });
  if (path === '/api/r')
    return supaRpc('react', { p_cid: b.cid, p_kind: b.kind, p_act: b.act || null });
  if (path === '/api/pin')
    return supaRpc('set_pins', { p_tid: b.tid, p_order: Array.isArray(b.order) ? b.order : [] });
  if (path === '/api/progress' && method === 'POST')
    return supaRpc('put_progress', { p_data: b.data });

  throw new Error('未知接口 ' + path);
}
/* ---------- 挂载到题目下方 ---------- */
function cmtMount(tid){
  const w=document.getElementById('qwrap'); if(!w) return;
  let box=document.getElementById('cmtBox');
  const same = box && box.dataset.tid===tid;
  if(!box){ box=document.createElement('div'); box.id='cmtBox'; box.className='cmt-box'; w.appendChild(box); }
  if(!same){
    const c=_cmtCache[tid];
    CMT.tid=tid; CMT.replyTo=null; CMT.draft='';
    CMT.list=(c&&c.list)||[]; CMT.me=(c&&c.me)||null;
  }
  box.dataset.tid=tid;
  box.innerHTML='<div class="cmt-hd">评论<span class="n" id="cmtN"></span>'
    +'<span class="cmt-state" id="cmtState"></span>'
    +'<span class="cmt-reload" onclick="cmtRefresh(true)">刷新</span></div>'
    +'<div class="cmt-list" id="cmtList"></div><div class="cmt-ft" id="cmtFt"></div>';
  cmtRender();
  const c=_cmtCache[tid];
  cmtMaybeRefresh(tid);
}
/* 缓存永不主动失效：先秒出上次内容，再后台静默拉新（60 秒节流，失败不提示） */
let _cmtTryTs=0;
function cmtMaybeRefresh(tid){
  const c=_cmtCache[tid];
  if(c && (Date.now()-(c.ts||0) < 60000)) return;
  if(Date.now()-_cmtTryTs < 60000) return;
  _cmtTryTs=Date.now();
  try{ cmtRefresh(false); }catch(e){}
}
function cmtAgo(ts){
  if(!ts) return '';
  const m=Math.floor(Math.max(0,Date.now()-ts)/60000);
  if(m<1) return '刚刚';
  if(m<60) return m+' 分钟前';
  const h=Math.floor(m/60); if(h<24) return h+' 小时前';
  return Math.floor(h/24)+' 天前';
}
function cmtGoto(){
  const b=document.getElementById('cmtBox'); if(!b) return;
  b.scrollIntoView({behavior:'smooth',block:'start'});
  const t=document.getElementById('cmtText'); if(t) setTimeout(function(){t.focus();},350);
}
function cmtFocusLogin(){
  ucClose();
  const b=document.getElementById('cmtBox'); if(b) b.scrollIntoView({behavior:'smooth',block:'start'});
  const t=document.getElementById('cmtNick'); if(t) setTimeout(function(){t.focus();},350);
}
function setCmtState(t){ const el=document.getElementById('cmtState'); if(el) el.textContent=t||''; }
async function cmtRefresh(manual){
  if(!CMT.tid||CMT.loading) return;
  CMT.loading=true; setCmtState('加载中…');
  try{
    if(!CMT.ready && !(await cmtInit())){
      setCmtState('评论服务离线'+(CMT.list.length?'（显示上次缓存）':''));
      CMT.loading=false; return;
    }
    const j=await cmtApi('/api/c/'+encodeURIComponent(CMT.tid));
    CMT.list=j.list||[]; CMT.me=j.me||null;
    _cmtCache[CMT.tid]={ts:Date.now(),list:CMT.list,me:CMT.me}; cmtCacheSave();
    setCmtState('');
    cmtRender();
  }catch(e){
    CMT.ready=false;   // 下回重新读 api.json，拿最新的隧道地址
    if(/401|请先登录/.test(e&&e.message||'')){
      setCmtState('登录已过期，点右上角 👤 重新登录');   // 不清登录态、不清缓存
    }else{
      // 静默：有缓存就继续显示缓存，不打扰刷题
      setCmtState((CMT.list&&CMT.list.length)?'':'');
    }
    if(manual) alert('连不上评论服务（'+e.message+'）\n\n可能是本机服务或公网隧道暂时中断，等几秒再点「刷新」。\n你发的评论/点赞会先存在本机，恢复后自动同步。');
    // 隧道地址可能刚漂移：3 秒后自动重解析并重试一次
    if(!manual && !CMT._retry){
      CMT._retry=setTimeout(function(){ CMT._retry=null; if(!CMT.loading) cmtRefresh(false); },3000);
    }
  }finally{ CMT.loading=false; }
}

/* ---------- 渲染 ---------- */
function cmtById(id){
  for(let i=0;i<CMT.list.length;i++) if(CMT.list[i].id===id) return CMT.list[i];
  const q=CMT.q||[]; for(let i=0;i<q.length;i++) if(q[i].id===id) return q[i];
  return null;
}
function cmtRender(){
  const list=document.getElementById('cmtList'), ft=document.getElementById('cmtFt'), nEl=document.getElementById('cmtN');
  if(!list||!ft) return;
  const old=document.getElementById('cmtText'); if(old) CMT.draft=old.value;
  const me=CMT.me||{like:[],dislike:[],star:[],pin:[]};
  if(nEl){
    let t=CMT.list.length?(' · '+CMT.list.length+' 条'):'';
    const c=_cmtCache[CMT.tid];
    if(c&&c.ts&&(Date.now()-c.ts)>3600000) t+=' · 更新于 '+cmtAgo(c.ts);
    nEl.textContent=t;
  }
  const chunk=function(title,arr,zone){
    if(!arr.length) return '';
    let h='<div class="cs-sec">'+title+'</div>';
    arr.forEach(function(c,i){ h+=cmtItem(c,zone,i,arr.length); });
    return h;
  };
  const mineIds={};
  (me.like||[]).forEach(function(id){mineIds[id]=1}); (me.star||[]).forEach(function(id){mineIds[id]=1});
  const rank=function(c){ return (c.likes||0)+(c.stars||0)-(c.dislikes||0); };
  const pinIdx=function(id){ const i=(me.pin||[]).indexOf(id); return i<0?1e9:i; };
  const mine=CMT.list.filter(function(c){return mineIds[c.id]})
    .sort(function(a,b){ return pinIdx(a.id)-pinIdx(b.id) || a.ts-b.ts; });
  const rest=CMT.list.filter(function(c){return !mineIds[c.id]});
  const top=rest.slice().sort(function(a,b){ return rank(b)-rank(a) || b.ts-a.ts; }).slice(0,3);
  const topIds={}; top.forEach(function(c){topIds[c.id]=1});
  const others=rest.filter(function(c){return !topIds[c.id]});
  const seed=Math.floor(Date.now()/86400000);
  const hh=function(s){ let x=2166136261; for(let i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,16777619); } return (x>>>0); };
  others.sort(function(a,b){ return hh(a.id+seed)-hh(b.id+seed); });

  let h='';
  const pend=cmtPending(CMT.tid);
  if(pend.length){
    h+='<div class="cs-sec">待同步 <b>'+pend.length+'</b><span style="text-transform:none;font-weight:400;color:#b3bac5">（电脑开机后自动发出）</span></div>';
    pend.forEach(function(c){ h+=cmtPendingItem(c); });
  }
  if(!CMT.list.length && !pend.length) h+='<div class="cs-empty" style="padding:16px 6px">还没有人评论，来说第一句</div>';
  h+=chunk('我点赞 / 收藏的（可 ↑↓ 调顺序）', mine, 'mine');
  h+=chunk('热门前 3 · 赞＋收藏−踩', top, 'top');
  h+=chunk('全部评论 · 每天轮换曝光', others, '');
  list.innerHTML=h;

  if(CMT.user){
    ft.innerHTML='<textarea id="cmtText" maxlength="800" placeholder="说点什么…（'+(CMT.replyTo?'回复 '+esc((cmtById(CMT.replyTo)||{}).nick||''):esc(CMT.user.nick))+'）"></textarea>'
      +'<button class="btn pri" style="height:36px;flex:0 0 auto" onclick="cmtSend()">发送</button>'
      +(CMT.replyTo?'<button class="btn line" style="height:36px;flex:0 0 auto" onclick="CMT.replyTo=null;cmtRender()">取消回复</button>':'');
    const t=document.getElementById('cmtText'); if(t&&CMT.draft) t.value=CMT.draft;
  }else{
    ft.innerHTML='<div class="cs-login" style="margin-bottom:0"><div style="margin-bottom:6px">登录后才能发评论 / 点赞。账号自己设，只能删自己的评论。</div>'
      +'<div class="uc-row"><input id="cmtNick" placeholder="昵称（2–16 位）" maxlength="16" autocomplete="off">'
      +'<input id="cmtPass" type="password" placeholder="密码（≥6 位）" autocomplete="current-password"></div>'
      +'<div class="uc-row" style="margin-top:6px"><button class="btn pri" style="flex:1" onclick="cmtAuth(\'login\')">登录</button>'
      +'<button class="btn line" style="flex:1" onclick="cmtAuth(\'reg\')">注册新账号</button></div></div>';
  }
}
function cmtItem(c, zone, idx, total){
  const me=CMT.me||{};
  const isMine=CMT.user&&c.uid===CMT.user.uid;
  const d=new Date(c.ts);
  const ts=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const rep=c.reply_to?cmtById(c.reply_to):null;
  const q=function(s){ return JSON.stringify(s); };
  return '<div class="citem '+(zone==='mine'?'mine':'')+'">'
    +'<div class="cmeta"><span class="cnick">'+esc(c.nick)+'</span>'
    +(isMine?'<span class="cbadge">我</span>':'')+'<span>'+ts+'</span>'
    +(zone==='top'?'<span class="cbadge" style="background:#fff6e6;color:#e08a00">热</span>':'')+'</div>'
    +'<div class="ctext">'+esc(c.text)+'</div>'
    +(rep?'<div class="creply">回复 '+esc(rep.nick)+'：'+esc(rep.text.slice(0,80))+'</div>':'')
    +'<div class="cact">'
    +'<button class="cbtn '+((me.like||[]).indexOf(c.id)>=0?'on':'')+'" onclick="cmtReact('+q(c.id)+',\'like\')">👍 '+(c.likes||0)+'</button>'
    +'<button class="cbtn '+((me.dislike||[]).indexOf(c.id)>=0?'on':'')+'" onclick="cmtReact('+q(c.id)+',\'dislike\')">👎 '+(c.dislikes||0)+'</button>'
    +'<button class="cbtn '+((me.star||[]).indexOf(c.id)>=0?'on':'')+'" onclick="cmtReact('+q(c.id)+',\'star\')">⭐ '+(c.stars||0)+'</button>'
    +'<span class="sp"></span>'
    +'<button class="cbtn" onclick="cmtReply('+q(c.id)+')">回复</button>'
    +(isMine?'<button class="cbtn del" onclick="cmtDel('+q(c.id)+')">删除</button>':'')
    +(zone==='mine'?'<button class="cbtn up" '+(idx===0?'disabled':'')+' onclick="cmtPinMove('+q(c.id)+',-1)">↑</button>'
      +'<button class="cbtn up" '+(idx===total-1?'disabled':'')+' onclick="cmtPinMove('+q(c.id)+',1)">↓</button>':'')
    +'</div></div>';
}
function cmtPendingItem(c){
  const d=new Date(c.ts);
  const ts=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return '<div class="citem mine">'
    +'<div class="cmeta"><span class="cnick">'+esc(c.nick)+'</span><span class="cbadge">我</span>'
    +'<span class="cbadge" style="background:#fff6e6;color:#e08a00">待同步</span><span>'+ts+'</span></div>'
    +'<div class="ctext">'+esc(c.text)+'</div>'
    +'<div class="cact"><span class="sp"></span>'
    +'<button class="cbtn del" onclick="cmtDelPending('+JSON.stringify(c.id)+')">删除</button></div></div>';
}
function cmtDelPending(id){ cmtQueueDel(id); cmtRender(); setCmtState('已删除待发评论'); }

async function cmtReact(cid,kind){
  if(!CMT.user){ setCmtState('先登录再点赞'); return; }
  const on=!cmtIsOn(kind,cid);
  cmtApplyLocal(kind,cid,on); cmtRender();      // 先本地生效，不等服务端
  try{
    await cmtApi('/api/r',{method:'POST',body:{cid:cid,kind:kind,act:on?'on':'off'}});
  }catch(e){
    if(cmtOfflineErr(e)){
      cmtOpsAdd({type:'react',cid:cid,kind:kind,act:on?'on':'off',ts:Date.now()});
      setCmtState('已存在本机，联网后自动同步');
      cmtScheduleFlush();
    }else{
      cmtApplyLocal(kind,cid,!on); cmtRender();   // 服务端拒绝 → 回滚
      setCmtState(e.message);
    }
  }
}
async function cmtDel(cid){
  if(!confirm('删除这条评论？')) return;
  const i=(CMT.list||[]).findIndex(function(x){return x.id===cid});
  try{ await cmtApi('/api/c/'+cid,{method:'DELETE'}); await cmtRefresh(false); }
  catch(e){
    if(cmtOfflineErr(e)){
      if(i>=0){ CMT.list.splice(i,1); cmtRender(); }
      cmtOpsAdd({type:'del',cid:cid,ts:Date.now()});
      setCmtState('已删除，联网后同步');
      cmtScheduleFlush();
    }else alert(e.message);
  }
}
function cmtReply(cid){
  CMT.replyTo=cid; cmtRender();
  const t=document.getElementById('cmtText'); if(t) t.focus();
}
async function cmtPinMove(cid,dir){
  const me=CMT.me||{}; const mineIds={};
  (me.like||[]).forEach(function(id){mineIds[id]=1}); (me.star||[]).forEach(function(id){mineIds[id]=1});
  const pinIdx=function(id){ const i=(me.pin||[]).indexOf(id); return i<0?1e9:i; };
  const cur=CMT.list.filter(function(c){return mineIds[c.id]})
    .sort(function(a,b){ return pinIdx(a.id)-pinIdx(b.id) || a.ts-b.ts; })
    .map(function(c){return c.id});
  const i=cur.indexOf(cid), j=i+dir;
  if(i<0||j<0||j>=cur.length) return;
  const t=cur[i]; cur[i]=cur[j]; cur[j]=t;
  try{ await cmtApi('/api/pin',{method:'POST',body:{tid:CMT.tid,order:cur}});
    if(CMT.me) CMT.me.pin=cur; cmtRender(); }
  catch(e){
    if(cmtOfflineErr(e)){
      if(CMT.me) CMT.me.pin=cur; cmtRender();
      cmtOpsAdd({type:'pin',tid:CMT.tid,order:cur,ts:Date.now()});
      setCmtState('已存在本机，联网后自动同步');
      cmtScheduleFlush();
    }else alert(e.message);
  }
}
function cmtOfflineErr(e){
  // HTTP 4xx（除 404=隧道地址失效）算“服务端明确拒绝”，其余都当离线（留着等补发）
  const m=/HTTP (\d+)/.exec(e&&e.message||'');
  if(m && +m[1]>=400 && +m[1]<500 && +m[1]!==404) return false;
  return true;
}
async function cmtSend(){
  const el=document.getElementById('cmtText'); const t=(el&&el.value||'').trim();
  if(!t) return;
  if(!CMT.user){ setCmtState('先登录'); return; }
  const tid=CMT.tid, reply=CMT.replyTo;
  const tmp={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
             tid:tid, uid:CMT.user.uid, nick:CMT.user.nick, text:t, ts:Date.now(),
             reply_to:reply, likes:0, dislikes:0, stars:0, pending:true};
  cmtQueueAdd(tmp);
  CMT.replyTo=null; CMT.draft=''; if(el) el.value='';
  cmtRender();                      // 先显示出来，绝不让用户白写
  try{
    await cmtApi('/api/c',{method:'POST',body:{tid:tid,text:t,reply_to:reply}});
    cmtQueueDel(tmp.id);
    setCmtState('');
    await cmtRefresh(false);
  }catch(e){
    if(!cmtOfflineErr(e)){          // 服务端明确拒绝（内容为空/未登录等）→ 撤回并提示
      cmtQueueDel(tmp.id); cmtRender(); alert(e.message); return;
    }
    setCmtState('已存在本机，电脑开机后自动发出');
    cmtScheduleFlush();
  }
}
/* ---- 补发队列 ---- */
let _flushing=false, _flushTimer=null;
async function cmtFlushQueue(silent){
  const nq=(CMT.q||[]).length, no=(CMT.ops||[]).length;
  if(_flushing || (!nq && !no)) return 0;
  if(!CMT.user || !CMT.user.token) return 0;      // 没登录不能代发
  _flushing=true; let n=0, m=0;
  try{
    if(!CMT.ready && !(await cmtInit())) return 0;
    const arr=(CMT.q||[]).slice();
    for(let i=0;i<arr.length;i++){
      const it=arr[i];
      try{
        await cmtApi('/api/c',{method:'POST',body:{tid:it.tid,text:it.text,reply_to:it.reply_to||null}});
        cmtQueueDel(it.id); n++;
      }catch(e){
        const mm=/HTTP (\d+)/.exec(e&&e.message||'');
        if(mm && (+mm[1]===400 || +mm[1]===409)){ cmtQueueDel(it.id); }   // 内容非法，丢弃这条
        else break;                                                        // 离线/未登录，下次再试
      }
    }
    /* 点赞/收藏/置顶/删评论：按顺序补同步 */
    const ops=(CMT.ops||[]).slice();
    for(let i=0;i<ops.length;i++){
      const op=ops[i];
      try{
        if(op.type==='react') await cmtApi('/api/r',{method:'POST',body:{cid:op.cid,kind:op.kind,act:op.act}});
        else if(op.type==='pin') await cmtApi('/api/pin',{method:'POST',body:{tid:op.tid,order:op.order}});
        else if(op.type==='del') await cmtApi('/api/c/'+op.cid,{method:'DELETE'});
        CMT.ops=(CMT.ops||[]).filter(function(x){return x!==op}); cmtOpsSave(); m++;
      }catch(e){
        const mm=/HTTP (\d+)/.exec(e&&e.message||'');
        if(mm && (+mm[1]===400 || +mm[1]===404 || +mm[1]===409)){      // 目标没了/非法 → 丢掉
          CMT.ops=(CMT.ops||[]).filter(function(x){return x!==op}); cmtOpsSave();
        }else break;
      }
    }
  }finally{ _flushing=false; }
  if(n||m){
    setCmtState('已补发 '+(n+m)+' 项'+((n&&m)?('（评论 '+n+' / 操作 '+m+'）'):''));
    if(n&&CMT.tid) await cmtRefresh(false);
    if(!silent) alert('已补发 '+(n+m)+' 项待同步内容');
  }
  return n+m;
}
function cmtScheduleFlush(){
  clearTimeout(_flushTimer);
  _flushTimer=setTimeout(function(){ cmtFlushQueue(true); },6000);
}
setInterval(function(){ if(cmtQueueCount()||cmtOpsCount()) cmtFlushQueue(true); },60000);
window.addEventListener('online', function(){ if(cmtQueueCount()||cmtOpsCount()) cmtFlushQueue(true); });

/* ===== 触屏手势：边缘左右划 = 退出 / 中间左右划 = 翻题 ===== */
function bindSwipe(){
  let sx=0, sy=0, st=0, tracking=false;
  const isField = el => el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);

  document.addEventListener('touchstart', e=>{
    if(e.touches.length!==1 || isField(e.target)){ tracking=false; return; }
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); tracking=true;
  }, {passive:true});

  document.addEventListener('touchmove', e=>{
    if(!tracking) return;
    // 垂直为主 → 交给页面滚动，不拦
    const dy=Math.abs(e.touches[0].clientY-sy);
    const dx=Math.abs(e.touches[0].clientX-sx);
    if(dy>dx*1.2) tracking=false;
  }, {passive:true});

  document.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(dt>800) return;
    if(Math.abs(dx)<55) return;
    if(Math.abs(dy)>Math.abs(dx)*0.75) return;   // 斜划不算
    const W=window.innerWidth;
    const fromLeft = sx < Math.min(60, W*0.08);
    const fromRight = sx > W - Math.min(60, W*0.08);

    // 命中：从边缘向外划 → 退出 / 返回上一级
    if((fromLeft && dx>0) || (fromRight && dx<0)){
      S._swiped = Date.now();
      e.preventDefault();
      backOne();
      return;
    }
    // 中间横划 → 翻题（有题组时）
    if(S.quiz && Math.abs(dx)>90){
      S._swiped = Date.now();
      if(dx>0) prev(); else next();
    }
  }, {passive:false});
}

function bindKeys(){
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(!S.quiz) return;
    const q=DB.questions[S.quiz.ids[S.idx]];
    const keys=Object.keys(q.xuanxiang||{}).sort();
    const n='123456789'.indexOf(e.key);
    if(n>=0&&n<keys.length){ e.preventDefault(); pick(keys[n]); return; }
    const a='ABCDEFGHI'.indexOf(e.key.toUpperCase());
    if(a>=0&&a<keys.length){ e.preventDefault(); pick(keys[a]); return; }
    if(e.key==='Enter'||e.key==='ArrowRight'){
      e.preventDefault();
      const tid=S.quiz.ids[S.idx], ar=S.answers[tid]||[];
      const rev=!!S.revealed[tid]||S.submitted;
      if(ar.length&&!rev) submitOne(); else next(); return;
    }
    if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); return; }
    if(e.key===' '){ e.preventDefault(); revealNow(); return; }
    if(e.key.toLowerCase()==='n'){ e.preventDefault(); const b=document.querySelector('.q-title .nbtn'); if(b) b.click(); return; }
    if(e.key.toLowerCase()==='s'){ e.preventDefault(); submit(); return; }
    if(e.key==='Escape'){
      if(document.getElementById('npop').classList.contains('on')){ closeNote(); return; }
      if(document.getElementById('sheet').classList.contains('on')){ closeSheet(); return; }
      backOne(); return;
    }
  });
  document.addEventListener('click',e=>{
    const pop=document.getElementById('npop');
    if(pop.classList.contains('on')&&!pop.contains(e.target)&&!e.target.classList.contains('nbtn')&&!e.target.classList.contains('o-nbtn')) closeNote();
  });
}
